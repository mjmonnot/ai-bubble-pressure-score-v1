name: update-data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.11"

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data
        run: |
          python src/aibps/fetch_market.py

      - name: Fetch credit data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/aibps/fetch_credit.py

      - name: Fetch sentiment data (Trends + Wiki + FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/aibps/fetch_sentiment.py

      - name: Compute AIBPS monthly composite
        run: |
          python src/aibps/compute.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/*.csv data/processed/*.csv || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update AIBPS data"
            git push
          fi
