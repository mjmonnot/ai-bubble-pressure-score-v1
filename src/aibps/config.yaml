# Indicator configuration for AIBPS v0.1
window_years: 10

# Equal weights across the six pillars (renormalized among available pillars at compute time)
weights:
  Market: 0.1667
  Credit: 0.1667
  Capex_Supply: 0.1667
  Infra: 0.1667
  Adoption: 0.1667
  Sentiment: 0.1667

indicators:
  - id: AI_Beta_Index
    pillar: Market
    source: yfinance
    ticker: SOXX
    transform: pct_yoy_percentile
  - id: EV_Sales_Proxy
    pillar: Market
    source: yfinance
    ticker: QQQ
    transform: valuation_proxy_percentile
  - id: Options_Skew_Placeholder
    pillar: Market
    source: manual
    transform: percentile

  - id: Hyperscaler_Capex_Revenue
    pillar: Capex_Supply
    source: manual_filings
    transform: percentile
  - id: Semicap_Book_to_Bill
    pillar: Capex_Supply
    source: manual_semiorg
    transform: percentile

  - id: Grid_Queue_MW
    pillar: Infra
    source: manual_iso
    transform: percentile
  - id: DC_Vacancy
    pillar: Infra
    source: manual_broker
    transform: inverted_percentile

  - id: Cloud_AI_Revenue_Growth
    pillar: Adoption
    source: manual_cloud
    transform: percentile

  - id: HY_OAS
    pillar: Credit
    source: fred
    fred_series: BAMLH0A0HYM2
    transform: percentile
  - id: IG_OAS
    pillar: Credit
    source: fred
    fred_series: BAMLC0A0CM
    transform: percentile

normalization:
  defaults:
    method: rolling_z_sigmoid
    window: 24
    z_clip: 4.0
  pillars:
    Market:
      method: rolling_z_sigmoid
      window: 60
      z_clip: 4.0
    Credit:
      method: rolling_z_sigmoid
      window: 60
      z_clip: 4.0
    Capex_Supply:
      method: rolling_z_sigmoid
      window: 24
      z_clip: 4.0
    Infra:
      method: rolling_z_sigmoid
      window: 36
      z_clip: 4.0
    Adoption:
      method: rolling_z_sigmoid
      window: 24
      z_clip: 4.0
    Sentiment:
      method: rolling_z_sigmoid
      window: 24
      z_clip: 4.0
